<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Control Panel - EduVault</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="nav-header">
        <div class="nav-container">
            <div class="logo">EduVault Admin Shield🛡️</div>
            <button onclick="logout()" class="btn"
                style="width: auto; padding: 6px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);">Logout</button>
        </div>
    </header>

    <main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
        <div class="glass-card" style="padding: 25px;">
            <h3 style="font-size: 1.2rem; color: #fff; margin-bottom: 20px;">Global Repository Moderation</h3>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr
                            style="border-bottom: 1px solid var(--panel-border); color: var(--text-sub); font-size: 0.85rem;">
                            <th style="padding: 12px;">TITLE</th>
                            <th style="padding: 12px;">SEMESTER</th>
                            <th style="padding: 12px;">AUTHOR</th>
                            <th style="padding: 12px;">GROQ AI STATUS</th>
                            <th style="padding: 12px; text-align: right;">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="adminTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token || localStorage.getItem('role') !== 'admin') window.location.href = '/login';

        async function fetchAdminNotes() {
            const res = await fetch('/api/notes');
            const data = await res.json();
            const tbody = document.getElementById('adminTable');
            tbody.innerHTML = '';

            data.notes.forEach(note => {
                tbody.innerHTML += `
          <tr style="border-bottom: 1px solid var(--panel-border); color: var(--text-main);">
            <td style="padding: 14px; font-weight: 600;">${note.title}</td>
            <td style="padding: 14px; color: var(--text-sub);">${note.semester}</td>
            <td style="padding: 14px; color: var(--text-sub);">${note.uploadedBy}</td>
            <td style="padding: 14px;">
              <span class="badge ${note.isAiVerified ? 'badge-verified' : 'badge-pending'}">
                ${note.isAiVerified ? 'Verified' : 'Pending'}
              </span>
            </td>
            <td style="padding: 14px; text-align: right;">
              <a href="${note.fileUrl}" target="_blank" style="color: var(--primary); margin-right: 15px; font-size: 0.9rem; text-decoration: none;">View</a>
              <button class="btn btn-danger" onclick="deleteNote('${note._id}')">Delete</button>
            </td>
          </tr>
        `;
            });
        }

        async function deleteNote(id) {
            if (!confirm('Are you sure you want to delete this resource permanently?')) return;

            const res = await fetch(`/api/notes/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': token }
            });
            const data = await res.json();
            if (data.success) {
                alert('Note removed permanently.');
                fetchAdminNotes();
            } else {
                alert(data.message);
            }
        }

        function logout() { localStorage.clear(); window.location.href = '/login'; }
        fetchAdminNotes();
    </script>
</body>

</html>
